<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boards Attack Plan: Board-prep Self-Assessment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --paper:#EEF0EA;
    --panel:#F7F8F3;
    --ink:#1C2321;
    --ink-soft:#4A544D;
    --line:#C7CCC0;
    --rust:#A1472F;
    --rust-dim:#E7D3CC;
    --pine:#3E5C4E;
    --pine-dim:#D8E1DB;
    --gold:#B98A2E;
    --gold-dim:#F0E2C2;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:48px 24px 96px;
  }
  h1,h2,h3{
    font-family:'Lora', Georgia, serif;
    font-weight:600;
    margin:0 0 8px;
    color:var(--ink);
  }
  h1{font-size:1.7rem; line-height:1.25;}
  h2{font-size:1.3rem;}
  h3{font-size:1.05rem; margin-bottom:6px;}
  p{margin:0 0 14px; color:var(--ink-soft);}
  .kicker{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:var(--pine);
    margin-bottom:10px;
    font-weight:600;
  }
  .rule{
    border:0;
    border-top:1px solid var(--line);
    margin:28px 0;
  }

  /* progress bar */
  .progress-track{
    display:flex;
    gap:4px;
    margin:0 0 30px;
  }
  .progress-seg{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .progress-seg.done{background:var(--pine);}
  .progress-seg.current::after{
    content:'';
    position:absolute; inset:0;
    background:var(--gold);
  }
  .progress-labels{
    display:flex;
    justify-content:space-between;
    font-size:0.7rem;
    color:var(--ink-soft);
    margin:6px 0 26px;
  }

  /* panels */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 28px;
    margin-bottom:20px;
  }

  button{
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
  }
  .btn{
    display:inline-block;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:12px 22px;
    font-size:0.92rem;
    font-weight:600;
    border-radius:var(--radius);
    letter-spacing:0.01em;
  }
  .btn:hover{background:var(--rust);}
  .btn:disabled{background:var(--line); color:#8b8f87; cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{background:var(--panel); color:var(--ink); border-color:var(--ink-soft);}
  .btn-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
  }

  /* question */
  .question{
    margin-bottom:26px;
  }
  .question:last-child{margin-bottom:0;}
  .qtext{
    font-size:0.98rem;
    margin-bottom:12px;
    color:var(--ink);
  }
  .scale{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
  }
  .scale label{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 4px 8px;
    text-align:center;
    font-size:0.68rem;
    color:var(--ink-soft);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .scale label:hover{border-color:var(--ink-soft);}
  .scale input{
    accent-color:var(--rust);
    width:16px; height:16px;
  }
  .scale label.checked{
    border-color:var(--rust);
    background:var(--rust-dim);
    color:var(--ink);
  }
  .scale-caption{
    display:flex;
    justify-content:space-between;
    font-size:0.68rem;
    color:var(--ink-soft);
    margin-top:16px;
  }

  /* results */
  .bar-row{
    display:grid;
    grid-template-columns:170px 1fr 34px;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .bar-label{
    font-size:0.85rem;
    font-weight:500;
  }
  .bar-track{
    height:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--pine);
  }
  .bar-fill.priority{background:var(--rust);}
  .bar-val{
    font-size:0.8rem;
    color:var(--ink-soft);
    text-align:right;
  }

  .badge{
    display:inline-block;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.02em;
    padding:3px 9px;
    border-radius:2px;
    background:var(--gold-dim);
    color:#7A5A16;
    margin-bottom:10px;
  }
  .priority-panel{
    border-left:3px solid var(--rust);
  }
  .priority-panel h3{color:var(--rust);}

  ul{
    margin:0 0 14px;
    padding-left:20px;
    color:var(--ink-soft);
  }
  li{margin-bottom:6px;}
  .field{
    margin-bottom:16px;
  }
  .field-label{
    font-size:0.78rem;
    font-weight:600;
    color:var(--pine);
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .pitfall{
    background:var(--rust-dim);
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:0.86rem;
    color:#5C2417;
  }

  .name-input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.95rem;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:18px;
  }

  .print-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:8px 14px;
    border-radius:var(--radius);
    font-size:0.8rem;
  }
  .print-btn:hover{border-color:var(--pine); color:var(--pine);}

  @media print{
    .no-print{display:none !important;}
    body{background:white;}
    .panel{border:1px solid #999;}
  }

  @media (max-width:520px){
    .scale{grid-template-columns:repeat(5,1fr);}
    .scale label{font-size:0.6rem; padding:8px 2px 6px;}
    .bar-row{grid-template-columns:110px 1fr 30px;}
    .panel{padding:20px 18px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DOMAINS = [
  {
    key: 'KG',
    name: 'Knowledge Gaps',
    short: 'Knowledge',
    questions: [
      "When I miss questions, it's usually because I never learned or don't remember the underlying fact at all, not because I second-guessed myself.",
      "Certain content areas (e.g., genetics, biostatistics, ethics, dermatology) feel like blind spots no matter how the question is phrased.",
      "My in-training exam score report shows several subspecialty areas well below the 30th percentile."
    ],
    priorityTitle: "Structured content coverage, ranked by weakest areas",
    fields: [
      { label: "How to structure the plan", items: [
        "Pull the ITE subspecialty percentile breakdown and rank weakest to strongest, then study in that order, not rotation order or textbook order.",
        "Pair each content block with 20–30 practice questions immediately after reading, so the material is tested, not just reviewed passively.",
        "Give the bottom quartile of content areas roughly double the time allotted to mid-range areas."
      ]},
      { label: "Tools", items: [
        "PREP Self-Assessment (PREP SA) for exam-style content coverage",
        "MedStudy or PREP: The Course for structured video/text review",
        "Red Book (Nelson's) for infectious disease depth, a frequent weak spot"
      ]},
      { label: "What to track", items: [
        "Percent of subspecialty areas scoring at or above the 50th percentile, trending up across successive ITEs or self-assessments."
      ]}
    ],
    pitfall: "Re-reading material that already feels comfortable because it's easier, instead of sitting with the genuinely weak areas."
  },
  {
    key: 'RET',
    name: 'Retention',
    short: 'Retention',
    questions: [
      "I recognize the topic when I see the explanation: I \"used to know this\" and it slipped away since I last studied it.",
      "Material I studied a month or more ago doesn't stick without deliberate review.",
      "I do well on practice blocks right after studying a topic, but worse when it's mixed in later with other topics."
    ],
    priorityTitle: "Spaced repetition and interleaving, not one-time coverage",
    fields: [
      { label: "How to structure the plan", items: [
        "Build a spaced review calendar: revisit each topic at roughly 1 week, 1 month, and 3 months after first covering it.",
        "Use interleaved (mixed-subject) practice blocks rather than single-subject blocks once a topic has had its first pass.",
        "Add a short weekly cumulative-recall quiz pulling from everything covered so far, not just the current week's topic."
      ]},
      { label: "Tools", items: [
        "A spaced-repetition flashcard system (e.g., Anki) for high-yield discrete facts",
        "Qbank set to mixed/random subject mode rather than single-topic mode for review blocks"
      ]},
      { label: "What to track", items: [
        "Accuracy on previously-covered topics when they reappear weeks later in mixed blocks. This is the real test of retention, not first-pass accuracy."
      ]}
    ],
    pitfall: "Studying a topic once and considering it \"done\" without a planned second and third exposure means it decays."
  },
  {
    key: 'TT',
    name: 'Test-Taking & Reasoning',
    short: 'Test-Taking',
    questions: [
      "I know the content but talk myself out of the right answer or get pulled toward a distractor.",
      "I struggle to figure out what the question is actually asking, especially with long vignettes.",
      "When I review missed questions, I say \"I knew that\" more often than \"I didn't know that.\""
    ],
    priorityTitle: "Structured question-approach training, not more content review",
    fields: [
      { label: "How to structure the plan", items: [
        "Practice reading the final question stem before the vignette, so you know what's being asked before wading through details.",
        "Use a deliberate elimination strategy: cross off two clearly wrong answers before comparing the remaining choices.",
        "Log each missed question as either a knowledge error or a reasoning error. This group should see reasoning errors dominate, and more content review won't fix those."
      ]},
      { label: "Tools", items: [
        "Untimed review sessions where you say the rationale for each answer choice out loud (works well with a peer or advisor)",
        "Qbank explanations reviewed for why distractors are wrong, not only why the correct answer is right"
      ]},
      { label: "What to track", items: [
        "The ratio of \"knew it but picked wrong\" errors to true knowledge gaps in the error log; the goal is shrinking that ratio over time."
      ]}
    ],
    pitfall: "Second-guessing and changing an initial answer without any new information to justify the change."
  },
  {
    key: 'TM',
    name: 'Time Management & Pacing',
    short: 'Pacing',
    questions: [
      "I run out of time or have to rush through the last portion of a practice block or exam.",
      "I re-read questions or answer choices multiple times before deciding.",
      "I lose track of how much time is left during practice blocks."
    ],
    priorityTitle: "Timed practice under realistic exam conditions, started earlier",
    fields: [
      { label: "How to structure the plan", items: [
        "Start timed block practice earlier in the overall plan, not only in the final weeks before the exam.",
        "Set explicit pace checkpoints (e.g., \"by question 20, I should be at roughly X minutes\") and check them mid-block.",
        "Use a flag-and-move rule: no question gets more than ~90 seconds on the first pass; flag and return if time remains."
      ]},
      { label: "Tools", items: [
        "Full-length timed practice exams, done under real time pressure rather than \"study mode\"",
        "A visible countdown or pace tracker during every Qbank session, not just full exams"
      ]},
      { label: "What to track", items: [
        "Number of questions left unanswered at time-call across successive practice blocks; this should trend toward zero."
      ]}
    ],
    pitfall: "Practicing almost exclusively in untimed \"study mode,\" which never actually trains pacing under pressure."
  },
  {
    key: 'TA',
    name: 'Exam Performance & Anxiety',
    short: 'Anxiety',
    questions: [
      "My performance on timed practice blocks is noticeably worse than my knowledge level under untimed, low-stakes conditions.",
      "I feel physically anxious (racing heart, trouble focusing) during timed exams more than during casual review.",
      "I've frozen or blanked on a question during a timed exam that I later realized I actually knew."
    ],
    priorityTitle: "Graded exposure to timed, high-stakes conditions plus basic performance strategies",
    fields: [
      { label: "How to structure the plan", items: [
        "Build graded exposure: start with short timed blocks and work up to full-length, proctored-style simulated exams.",
        "Establish a consistent pre-block routine (brief breathing or physical reset) and use it every time, not just on exam day.",
        "Keep this work separate from content-review time so it doesn't get crowded out by \"just doing more questions.\""
      ]},
      { label: "Tools", items: [
        "Full-length proctored-style practice exams, ideally at the same time of day as the real exam",
        "A short, repeatable breathing or grounding routine used before every timed block",
        "A learning specialist or institutional wellness resource, if this is a significant or longstanding pattern"
      ]},
      { label: "What to track", items: [
        "The gap between untimed practice accuracy and timed practice accuracy; the goal is narrowing that gap, not eliminating timed practice."
      ]}
    ],
    pitfall: "Treating this purely as a content problem and adding more Qbank volume, which doesn't address the performance piece."
  }
];

const SCALE_LABELS = ["Rarely / never", "Occasionally", "Sometimes", "Often", "Very often / almost always"];

// TODO: replace with the actual REDCap post-survey link. In REDCap's survey settings,
// set "auto-redirect after survey completion" to send residents back to this tool's
// published URL with ?unlock=1 appended, so the save/print option appears on return.
const POST_SURVEY_URL = 'https://redcap.upstate.edu/surveys/?s=K4C4CY7XLMFME3TC';

const STORAGE_KEY = 'boardsAttackPlanState';

let state = {
  screen: 'intro',
  residentName: '',
  currentDomainIdx: 0,
  answers: {}, // key: "KG-0" -> value 1-5
};

let unlocked = false;
const SURVEY_FLAG = 'boardsAttackPlanSurveyOpened';
try {
  unlocked = new URLSearchParams(window.location.search).get('unlock') === '1'
          || /(^|[#&?])unlock=1/.test(window.location.hash || '');
} catch(e) { /* ignore */ }
// Backup unlock: the viewer may not pass the URL parameter through, so also honor
// a flag set when this browser opened the follow-up survey from the tool.
try {
  if (!unlocked && localStorage.getItem(SURVEY_FLAG) === '1' && localStorage.getItem(STORAGE_KEY)) unlocked = true;
} catch(e) { /* ignore */ }

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed && parsed.answers && Object.keys(parsed.answers).length) {
      state.residentName = parsed.residentName || '';
      state.answers = parsed.answers;
      state.screen = 'results';
    }
  }
} catch(e) { /* ignore corrupted storage */ }

function saveProgress(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      residentName: state.residentName,
      answers: state.answers,
    }));
  } catch(e) { /* storage unavailable: non-fatal, just means no round-trip persistence */ }
}

function clearProgress(){
  try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(SURVEY_FLAG); } catch(e) { /* ignore */ }
}

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.forEach(c=>{
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'intro') app.appendChild(renderIntro());
  else if(state.screen === 'question') app.appendChild(renderQuestionScreen());
  else if(state.screen === 'results') app.appendChild(renderResults());
}

function renderIntro(){
  const c = document.createDocumentFragment();
  const wrap = el('div', {});
  wrap.appendChild(el('div', {class:'kicker'}, 'BOARDS ATTACK PLAN: STEP 1'));
  wrap.appendChild(el('h1', {}, 'Board-prep Self-Assessment'));
  wrap.appendChild(el('p', {}, 'Before building a study calendar, it helps to know what\'s actually driving missed questions. This short assessment (15 statements, about 5 minutes) sorts your experience into five common obstacles, then hands you a study model built around your specific pattern rather than a generic review plan.'));

  const panel = el('div', {class:'panel'});
  panel.appendChild(el('div', {class:'field-label'}, "Resident's name (optional, for your records)"));
  const input = el('input', {class:'name-input', type:'text', placeholder:'e.g., J. Alvarez, PGY-2'});
  input.addEventListener('input', e=> state.residentName = e.target.value);
  panel.appendChild(input);
  panel.appendChild(el('p', {}, 'Answer honestly based on recent in-training exam or Qbank experience; there are no right answers, only a clearer picture of where to focus.'));
  const btn = el('button', {class:'btn', onclick: ()=>{ state.screen='question'; state.currentDomainIdx=0; render(); }}, 'Begin assessment');
  panel.appendChild(btn);
  wrap.appendChild(panel);
  c.appendChild(wrap);
  return c;
}

function renderProgress(){
  const track = el('div', {class:'progress-track'});
  DOMAINS.forEach((d, i)=>{
    let cls = 'progress-seg';
    if(i < state.currentDomainIdx) cls += ' done';
    if(i === state.currentDomainIdx) cls += ' current';
    track.appendChild(el('div', {class:cls}));
  });
  const labels = el('div', {class:'progress-labels'});
  DOMAINS.forEach((d,i)=>{
    labels.appendChild(el('span', {}, d.short));
  });
  const frag = document.createDocumentFragment();
  frag.appendChild(track);
  frag.appendChild(labels);
  return frag;
}

function renderQuestionScreen(){
  const domain = DOMAINS[state.currentDomainIdx];
  const wrap = el('div', {});
  wrap.appendChild(renderProgress());
  wrap.appendChild(el('div', {class:'kicker'}, `SECTION ${state.currentDomainIdx+1} OF ${DOMAINS.length}`));
  wrap.appendChild(el('h2', {}, domain.name));

  const panel = el('div', {class:'panel'});
  domain.questions.forEach((qtext, qi)=>{
    const qkey = `${domain.key}-${qi}`;
    const qdiv = el('div', {class:'question'});
    qdiv.appendChild(el('div', {class:'qtext'}, qtext));
    const scale = el('div', {class:'scale'});
    for(let v=1; v<=5; v++){
      const checked = state.answers[qkey] === v;
      const label = el('label', {class: checked ? 'checked' : ''});
      const radio = el('input', {type:'radio', name:qkey, value:v});
      radio.checked = checked;
      radio.addEventListener('change', ()=>{
        state.answers[qkey] = v;
        render();
      });
      label.appendChild(radio);
      label.appendChild(el('span', {}, String(v)));
      scale.appendChild(label);
    }
    qdiv.appendChild(scale);
    const cap = el('div', {class:'scale-caption'});
    cap.appendChild(el('span', {}, SCALE_LABELS[0]));
    cap.appendChild(el('span', {}, SCALE_LABELS[4]));
    qdiv.appendChild(cap);
    panel.appendChild(qdiv);
  });
  wrap.appendChild(panel);

  const allAnswered = domain.questions.every((_, qi)=> state.answers[`${domain.key}-${qi}`] !== undefined);

  const btnRow = el('div', {class:'btn-row'});
  const backBtn = el('button', {class:'btn btn-ghost', onclick: ()=>{
    if(state.currentDomainIdx === 0){ state.screen='intro'; } else { state.currentDomainIdx--; }
    render();
  }}, '← Back');
  const nextLabel = state.currentDomainIdx === DOMAINS.length - 1 ? 'See results →' : 'Next section →';
  const nextBtn = el('button', {class:'btn', onclick: ()=>{
    if(state.currentDomainIdx === DOMAINS.length - 1){ state.screen='results'; saveProgress(); }
    else { state.currentDomainIdx++; }
    render();
    window.scrollTo(0,0);
  }}, nextLabel);
  nextBtn.disabled = !allAnswered;
  btnRow.appendChild(backBtn);
  btnRow.appendChild(nextBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

function computeScores(){
  return DOMAINS.map(d=>{
    let sum = 0;
    d.questions.forEach((_, qi)=> sum += (state.answers[`${d.key}-${qi}`] || 0));
    return { domain: d, score: sum };
  }).sort((a,b)=> b.score - a.score);
}

function renderResults(){
  const scored = computeScores();
  const top = scored[0].score;
  const priorityDomains = scored.filter(s => s.score >= top - 2 && s.score >= 9);
  const priorityKeys = new Set(priorityDomains.map(p=>p.domain.key));

  const wrap = el('div', {});
  wrap.appendChild(el('div', {class:'kicker'}, 'RESULTS'));
  wrap.appendChild(el('h1', {}, state.residentName ? `Study Model for ${state.residentName}` : 'Your Study Model'));
  wrap.appendChild(el('p', {}, 'Scores below run from 3 (low signal) to 15 (strong signal) per domain. The domain(s) in rust are the priority focus for the study plan, not the only thing to work on, but where the plan should put its weight first.'));

  const barsPanel = el('div', {class:'panel'});
  scored.forEach(s=>{
    const row = el('div', {class:'bar-row'});
    row.appendChild(el('div', {class:'bar-label'}, s.domain.short));
    const track = el('div', {class:'bar-track'});
    const fill = el('div', {class: 'bar-fill' + (priorityKeys.has(s.domain.key) ? ' priority' : '')});
    fill.style.width = `${(s.score/15*100).toFixed(0)}%`;
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', {class:'bar-val'}, `${s.score}/15`));
    wrap.appendChild; // no-op guard
    barsPanel.appendChild(row);
  });
  wrap.appendChild(barsPanel);

  wrap.appendChild(el('hr', {class:'rule'}));

  if(priorityDomains.length > 1){
    wrap.appendChild(el('p', {}, `This resident shows a mixed pattern across ${priorityDomains.map(p=>p.domain.name.toLowerCase()).join(' and ')}. Build the plan around both. For example, dedicate the first portion of each study session to the content-focused domain's approach, and layer in the second domain's practice structure (e.g., timed blocks, error-logging) around it, rather than sequencing them.`));
  }

  priorityDomains.forEach(p=>{
    const domain = p.domain;
    const panel = el('div', {class:'panel priority-panel'});
    panel.appendChild(el('div', {class:'badge'}, 'PRIORITY FOCUS'));
    panel.appendChild(el('h3', {}, domain.name));
    panel.appendChild(el('p', {}, domain.priorityTitle));
    domain.fields.forEach(f=>{
      panel.appendChild(el('div', {class:'field-label'}, f.label));
      const ul = el('ul', {});
      f.items.forEach(it=> ul.appendChild(el('li', {}, it)));
      panel.appendChild(ul);
    });
    panel.appendChild(el('div', {class:'field-label'}, 'Common pitfall'));
    panel.appendChild(el('div', {class:'pitfall'}, domain.pitfall));
    wrap.appendChild(panel);
  });

  // Secondary domains, brief
  const secondary = scored.filter(s => !priorityKeys.has(s.domain.key) && s.score >= 9);
  if(secondary.length){
    const panel = el('div', {class:'panel'});
    panel.appendChild(el('h3', {}, 'Worth keeping an eye on'));
    const ul = el('ul', {});
    secondary.forEach(s=> ul.appendChild(el('li', {}, `${s.domain.name} (${s.score}/15): ${s.domain.priorityTitle.toLowerCase()}.`)));
    panel.appendChild(ul);
    wrap.appendChild(panel);
  }

  if(scored.every(s => s.score < 9)){
    const panel = el('div', {class:'panel'});
    panel.appendChild(el('p', {}, 'No single domain stands out strongly. This resident may be closer to a general review situation than a specific pattern. Consider a broad content review paced against ITE subspecialty percentiles, with a routine timed practice block scheduled weekly to keep an eye on pacing and performance as the plan progresses.'));
    wrap.appendChild(panel);
  }

  const btnRow = el('div', {class:'btn-row no-print'});
  const restartBtn = el('button', {class:'btn btn-ghost', onclick: ()=>{
    clearProgress();
    state = {screen:'intro', residentName:'', currentDomainIdx:0, answers:{}};
    render();
    window.scrollTo(0,0);
  }}, '↺ Start over');
  btnRow.appendChild(restartBtn);

  if (unlocked) {
    const downloadBtn = el('button', {class:'print-btn', onclick: ()=> downloadReport(scored, priorityKeys, priorityDomains, secondary)}, '⬇ Download PDF');
    btnRow.appendChild(downloadBtn);
    wrap.appendChild(btnRow);
    wrap.appendChild(el('p', {style:'font-size:0.75rem; color:var(--ink-soft); margin-top:8px;'}, 'Downloads this study model as a PDF file.'));
  } else {
    wrap.appendChild(btnRow);
    const unlockPanel = el('div', {class:'panel no-print', style:'margin-top:16px;'});
    unlockPanel.appendChild(el('div', {class:'field-label'}, 'Want to save or print this?'));
    unlockPanel.appendChild(el('p', {}, 'Your results are shown above and yours to keep reading right now. To unlock a downloadable copy, complete this short follow-up survey (about 3\u20135 minutes). You\u2019ll be brought back here automatically with the save option unlocked.'));
    const unlockBtn = el('a', {class:'btn', href: POST_SURVEY_URL, style:'display:inline-block; text-decoration:none;', onclick: ()=>{ try{ localStorage.setItem(SURVEY_FLAG, '1'); }catch(e){} }}, 'Complete follow-up survey \u2192');
    unlockPanel.appendChild(unlockBtn);
    wrap.appendChild(unlockPanel);
  }

  return wrap;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function buildReportHTML(scored, priorityKeys, priorityDomains, secondary){
  const title = state.residentName ? `Study Model for ${escapeHtml(state.residentName)}` : 'Study Model';
  const dateStr = new Date().toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});

  const barsHtml = scored.map(s=>{
    const pct = (s.score/15*100).toFixed(0);
    const isPriority = priorityKeys.has(s.domain.key);
    return `
      <div class="bar-row">
        <div class="bar-label">${escapeHtml(s.domain.short)}</div>
        <div class="bar-track"><div class="bar-fill${isPriority ? ' priority' : ''}" style="width:${pct}%"></div></div>
        <div class="bar-val">${s.score}/15</div>
      </div>`;
  }).join('');

  const mixedNote = priorityDomains.length > 1
    ? `<p>This resident shows a mixed pattern across ${escapeHtml(priorityDomains.map(p=>p.domain.name.toLowerCase()).join(' and '))}. Build the plan around both. For example, dedicate the first portion of each study session to the content-focused domain's approach, and layer in the second domain's practice structure (e.g., timed blocks, error-logging) around it, rather than sequencing them.</p>`
    : '';

  const priorityHtml = priorityDomains.map(p=>{
    const domain = p.domain;
    const fieldsHtml = domain.fields.map(f=>`
        <div class="field-label">${escapeHtml(f.label)}</div>
        <ul>${f.items.map(it=>`<li>${escapeHtml(it)}</li>`).join('')}</ul>`).join('');
    return `
      <div class="panel priority-panel">
        <div class="badge">PRIORITY FOCUS</div>
        <h3>${escapeHtml(domain.name)}</h3>
        <p>${escapeHtml(domain.priorityTitle)}</p>
        ${fieldsHtml}
        <div class="field-label">Common pitfall</div>
        <div class="pitfall">${escapeHtml(domain.pitfall)}</div>
      </div>`;
  }).join('');

  const secondaryHtml = secondary.length ? `
      <div class="panel">
        <h3>Worth keeping an eye on</h3>
        <ul>${secondary.map(s=>`<li>${escapeHtml(s.domain.name)} (${s.score}/15): ${escapeHtml(s.domain.priorityTitle.toLowerCase())}.</li>`).join('')}</ul>
      </div>` : '';

  const allLowHtml = scored.every(s => s.score < 9) ? `
      <div class="panel">
        <p>No single domain stands out strongly. This resident may be closer to a general review situation than a specific pattern. Consider a broad content review paced against ITE subspecialty percentiles, with a routine timed practice block scheduled weekly to keep an eye on pacing and performance as the plan progresses.</p>
      </div>` : '';

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>${title}</title>
<style>
  body{ font-family: Georgia, 'Times New Roman', serif; background:#EEF0EA; color:#1C2321; margin:0; padding:0; }
  .wrap{ max-width:700px; margin:0 auto; padding:40px 24px 80px; }
  h1,h3{ font-family: Georgia, serif; font-weight:600; margin:0 0 8px; }
  h1{ font-size:1.6rem; }
  h3{ font-size:1.05rem; }
  p{ margin:0 0 14px; color:#4A544D; font-family: Arial, Helvetica, sans-serif; font-size:0.95rem; line-height:1.5; }
  .meta{ font-family: Arial, sans-serif; font-size:0.8rem; color:#4A544D; margin-bottom:24px; }
  .panel{ background:#F7F8F3; border:1px solid #C7CCC0; border-radius:3px; padding:24px; margin-bottom:20px; }
  .bar-row{ display:grid; grid-template-columns:140px 1fr 40px; align-items:center; gap:10px; margin-bottom:10px; font-family: Arial, sans-serif; font-size:0.85rem; }
  .bar-track{ height:12px; background:#EEF0EA; border:1px solid #C7CCC0; border-radius:2px; overflow:hidden; }
  .bar-fill{ height:100%; background:#3E5C4E; }
  .bar-fill.priority{ background:#A1472F; }
  .bar-val{ text-align:right; color:#4A544D; }
  .badge{ display:inline-block; font-family: Arial, sans-serif; font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:2px; background:#F0E2C2; color:#7A5A16; margin-bottom:10px; letter-spacing:0.03em; }
  .priority-panel{ border-left:3px solid #A1472F; }
  .priority-panel h3{ color:#A1472F; }
  .field-label{ font-family: Arial, sans-serif; font-size:0.75rem; font-weight:700; color:#3E5C4E; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  ul{ margin:0 0 14px; padding-left:20px; color:#4A544D; font-family: Arial, sans-serif; font-size:0.9rem; }
  li{ margin-bottom:6px; }
  .pitfall{ background:#E7D3CC; border-radius:3px; padding:10px 14px; font-family: Arial, sans-serif; font-size:0.86rem; color:#5C2417; }
  hr{ border:0; border-top:1px solid #C7CCC0; margin:24px 0; }
  @media print{ body{ background:white; } .panel{ border:1px solid #999; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>${title}</h1>
    <div class="meta">Boards Attack Plan: Board-prep Self-Assessment · Generated ${dateStr}</div>
    <p>Scores run from 3 (low signal) to 15 (strong signal) per domain. Domains in rust are the priority focus for the study plan.</p>
    <div class="panel">${barsHtml}</div>
    <hr>
    ${mixedNote}
    ${priorityHtml}
    ${secondaryHtml}
    ${allLowHtml}
  </div>
</body>
</html>`;
}

function namePart(){
  return (state.residentName || 'resident').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'resident';
}

// Saves a file: uses the viewer's download permission when hosted as an artifact,
// otherwise falls back to a normal browser download (works when hosted elsewhere).
async function saveFile(blob, filename){
  try{
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({filename, data: blob}); return; }
    }
  } catch(e) { if (e && e.code === 'declined') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

function downloadReportHtml(scored, priorityKeys, priorityDomains, secondary){
  try{
    const html = buildReportHTML(scored, priorityKeys, priorityDomains, secondary);
    const blob = new Blob([html], {type:'text/html'});
    saveFile(blob, `study-model-${namePart()}.html`);
  } catch(err){
    alert('Download didn\'t start automatically. Try opening this assessment directly (not embedded) and downloading again, or copy the results manually.');
  }
}

function downloadReport(scored, priorityKeys, priorityDomains, secondary){
  try{
    const pageWidth = 612, pageHeight = 792, margin = 54;
    const contentWidth = pageWidth - margin * 2;
    let pagesOps = [[]];
    let pageIdx = 0;
    let y = margin;

    const INK = [28, 35, 33];
    const INK_SOFT = [74, 84, 77];
    const LINE = [199, 204, 192];
    const RUST = [161, 71, 47];
    const PINE = [62, 92, 78];
    const GOLD_TEXT = [122, 90, 22];
    const PITFALL_TEXT = [92, 36, 23];
    const TRACK_BG = [238, 240, 234];

    const FONT_RES = {
      'helvetica-normal': 'F1', 'helvetica-bold': 'F2', 'helvetica-italic': 'F3',
      'times-normal': 'F4', 'times-bold': 'F5', 'times-italic': 'F6'
    };
    const CANVAS_FONT = {
      'helvetica-normal': {family:'Arial, Helvetica, sans-serif', weight:'normal', style:'normal'},
      'helvetica-bold': {family:'Arial, Helvetica, sans-serif', weight:'bold', style:'normal'},
      'helvetica-italic': {family:'Arial, Helvetica, sans-serif', weight:'normal', style:'italic'},
      'times-normal': {family:'"Times New Roman", Times, serif', weight:'normal', style:'normal'},
      'times-bold': {family:'"Times New Roman", Times, serif', weight:'bold', style:'normal'},
      'times-italic': {family:'"Times New Roman", Times, serif', weight:'normal', style:'italic'}
    };

    function fontKey(font, style){
      if(font === 'times'){
        if(style === 'bold') return 'times-bold';
        if(style === 'italic') return 'times-italic';
        return 'times-normal';
      }
      if(style === 'bold') return 'helvetica-bold';
      if(style === 'italic') return 'helvetica-italic';
      return 'helvetica-normal';
    }

    function sanitize(str){
      return String(str)
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[\u2013\u2014]/g, '-')
        .replace(/\u2026/g, '...')
        .replace(/\u2022/g, '-')
        .replace(/[^\x00-\xFF]/g, '?');
    }

    function escapeStr(str){
      return str.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
    }

    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    function measureWidth(text, key, size){
      const f = CANVAS_FONT[key];
      mctx.font = `${f.style} ${f.weight} ${size}px ${f.family}`;
      return mctx.measureText(text).width;
    }
    function wrapText(text, key, size, maxWidth){
      const words = text.split(' ');
      const lines = [];
      let cur = '';
      words.forEach(w=>{
        const test = cur ? cur + ' ' + w : w;
        if(cur && measureWidth(test, key, size) > maxWidth){
          lines.push(cur);
          cur = w;
        } else {
          cur = test;
        }
      });
      if(cur) lines.push(cur);
      return lines.length ? lines : [''];
    }

    function op(s){ pagesOps[pageIdx].push(s); }
    function newPage(){ pagesOps.push([]); pageIdx++; y = margin; }
    function checkPageBreak(needed){ if(y + needed > pageHeight - margin){ newPage(); } }
    function col(c){ return c.map(v => (v/255).toFixed(3)).join(' '); }

    function drawTextLine(line, x, yTop, key, size, color){
      const baseline = pageHeight - yTop - size * 0.82;
      op('BT');
      op(`/${FONT_RES[key]} ${size} Tf`);
      op(`${col(color)} rg`);
      op(`${x.toFixed(2)} ${baseline.toFixed(2)} Td (${escapeStr(sanitize(line))}) Tj`);
      op('ET');
    }

    function addText(text, opts={}){
      const x = opts.x ?? margin;
      const size = opts.size || 10;
      const key = fontKey(opts.font || 'helvetica', opts.style || 'normal');
      const color = opts.color || INK;
      const width = opts.width || (contentWidth - (x - margin));
      const lines = wrapText(sanitize(text), key, size, width);
      const lineHeight = size * 1.18;
      lines.forEach(line=>{
        checkPageBreak(lineHeight);
        drawTextLine(line, x, y, key, size, color);
        y += lineHeight;
      });
      y += (opts.gapAfter ?? 6);
    }

    function addBullets(items, opts={}){
      const x = (opts.x ?? margin) + 4;
      items.forEach(it=>{
        addText('-  ' + it, { x, size: 9.3, font: 'helvetica', color: INK_SOFT, width: contentWidth - (x - margin) - 4, gapAfter: 3 });
      });
      y += 3;
    }

    function drawRect(xTop, yTop, w, h, style, fillColor, strokeColor, lineWidth){
      const yBottom = pageHeight - yTop - h;
      if(strokeColor){ op(`${col(strokeColor)} RG`); op(`${lineWidth || 1} w`); }
      if(fillColor) op(`${col(fillColor)} rg`);
      op(`${xTop.toFixed(2)} ${yBottom.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re`);
      if(style === 'F') op('f');
      else if(style === 'S') op('S');
      else if(style === 'B') op('B');
    }

    function hr(gapBefore=4, gapAfter=10){
      y += gapBefore;
      checkPageBreak(gapAfter + 2);
      op(`${col(LINE)} RG`);
      op('0.75 w');
      const yLine = pageHeight - y;
      op(`${margin.toFixed(2)} ${yLine.toFixed(2)} m ${(pageWidth - margin).toFixed(2)} ${yLine.toFixed(2)} l S`);
      y += gapAfter;
    }

    // ---- Title ----
    addText(state.residentName ? `Study Model for ${state.residentName}` : 'Study Model', { font: 'times', style: 'bold', size: 19, color: INK, gapAfter: 3 });
    const dateStr = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    addText(`Boards Attack Plan - Board-prep Self-Assessment  |  Generated ${dateStr}`, { size: 8.5, style: 'italic', color: INK_SOFT, gapAfter: 10 });
    hr(0, 12);

    addText('Scores run from 3 (low signal) to 15 (strong signal) per domain. Domains in rust below are the priority focus for the study plan.', { size: 9.5, color: INK_SOFT, gapAfter: 10 });

    // ---- Score bars ----
    const barX = margin + 130;
    const barWidth = contentWidth - 130 - 40;
    const barHeight = 9;
    scored.forEach(s=>{
      checkPageBreak(barHeight + 8);
      const isPriority = priorityKeys.has(s.domain.key);
      drawTextLine(sanitize(s.domain.short), margin, y - 1, 'helvetica-bold', 9.5, INK);
      drawRect(barX, y, barWidth, barHeight, 'F', TRACK_BG, null, 0);
      drawRect(barX, y, barWidth, barHeight, 'S', null, LINE, 0.5);
      const fillW = Math.max(2, barWidth * (s.score / 15));
      drawRect(barX, y, fillW, barHeight, 'F', isPriority ? RUST : PINE, null, 0);
      drawTextLine(`${s.score}/15`, barX + barWidth + 8, y - 1, 'helvetica-normal', 9, INK_SOFT);
      y += barHeight + 8;
    });

    hr(6, 14);

    if(priorityDomains.length > 1){
      addText(`This resident shows a mixed pattern across ${priorityDomains.map(p=>p.domain.name.toLowerCase()).join(' and ')}. Build the plan around both - dedicate the first portion of each study session to the content-focused domain's approach, and layer in the second domain's practice structure (e.g., timed blocks, error-logging) around it, rather than sequencing them.`, { size: 9.5, style: 'italic', color: INK_SOFT, gapAfter: 12 });
    }

    priorityDomains.forEach((p, idx)=>{
      const domain = p.domain;
      checkPageBreak(60);
      addText('PRIORITY FOCUS', { size: 8, style: 'bold', color: GOLD_TEXT, gapAfter: 2 });
      addText(domain.name, { font: 'times', style: 'bold', size: 14, color: RUST, gapAfter: 2 });
      addText(domain.priorityTitle, { size: 9.5, style: 'italic', color: INK_SOFT, gapAfter: 8 });
      domain.fields.forEach(f=>{
        addText(f.label.toUpperCase(), { size: 8, style: 'bold', color: PINE, gapAfter: 3 });
        addBullets(f.items);
      });
      addText('COMMON PITFALL', { size: 8, style: 'bold', color: PITFALL_TEXT, gapAfter: 3 });
      addText(domain.pitfall, { size: 9.3, style: 'italic', color: PITFALL_TEXT, gapAfter: 10 });
      if(idx < priorityDomains.length - 1) hr(2, 12);
    });

    if(secondary.length){
      hr(4, 12);
      addText('Worth keeping an eye on', { font: 'times', style: 'bold', size: 12, color: INK, gapAfter: 6 });
      addBullets(secondary.map(s=> `${s.domain.name} (${s.score}/15) - ${s.domain.priorityTitle.toLowerCase()}.`));
    }

    if(scored.every(s => s.score < 9)){
      hr(4, 12);
      addText('No single domain stands out strongly - this resident may be closer to a general review situation than a specific pattern. Consider a broad content review paced against ITE subspecialty percentiles, with a routine timed practice block scheduled weekly to keep an eye on pacing and performance as the plan progresses.', { size: 9.5, color: INK_SOFT });
    }

    // ---- Assemble raw PDF bytes (no external libraries) ----
    const objects = [];
    objects.push(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);

    const numPages = pagesOps.length;
    const pageObjNums = [], contentObjNums = [];
    let nextNum = 9;
    for(let i=0;i<numPages;i++){ pageObjNums.push(nextNum++); contentObjNums.push(nextNum++); }
    const kidsStr = pageObjNums.map(n=>`${n} 0 R`).join(' ');
    objects.push(`2 0 obj\n<< /Type /Pages /Kids [${kidsStr}] /Count ${numPages} >>\nendobj\n`);

    const fontDefs = ['Helvetica','Helvetica-Bold','Helvetica-Oblique','Times-Roman','Times-Bold','Times-Italic'];
    fontDefs.forEach((f, idx)=>{
      objects.push(`${3+idx} 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>\nendobj\n`);
    });

    const resourcesStr = `/Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R /F5 7 0 R /F6 8 0 R >> >>`;
    for(let i=0;i<numPages;i++){
      const pageNum = pageObjNums[i], contentNum = contentObjNums[i];
      objects.push(`${pageNum} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] ${resourcesStr} /Contents ${contentNum} 0 R >>\nendobj\n`);
      const streamBody = pagesOps[i].join('\n');
      objects.push(`${contentNum} 0 obj\n<< /Length ${streamBody.length} >>\nstream\n${streamBody}\nendstream\nendobj\n`);
    }

    const totalObjects = 8 + numPages * 2;
    let pdf = '%PDF-1.4\n';
    const offsets = [0];
    objects.forEach(objStr=>{ offsets.push(pdf.length); pdf += objStr; });
    const xrefStart = pdf.length;
    let xref = `xref\n0 ${totalObjects+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=totalObjects;i++){ xref += String(offsets[i]).padStart(10,'0') + ' 00000 n \n'; }
    pdf += xref;
    pdf += `trailer\n<< /Size ${totalObjects+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;

    const bytes = new Uint8Array(pdf.length);
    for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;

    const blob = new Blob([bytes], { type: 'application/pdf' });
    saveFile(blob, `study-model-${namePart()}.pdf`);
  } catch(err){
    downloadReportHtml(scored, priorityKeys, priorityDomains, secondary);
  }
}

render();
</script>
